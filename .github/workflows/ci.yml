name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run lint:check || echo "Lint warnings (non-blocking)"

  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: dojiro_test
          MARIADB_USER: dojiro
          MARIADB_PASSWORD: dojiro_pass
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    env:
      DATABASE_URL: mysql://dojiro:dojiro_pass@127.0.0.1:3306/dojiro_test
      JWT_SECRET: test-secret-key-for-ci
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build
        run: npm run build
      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 3306 2>/dev/null; then
              echo "MariaDB TCP port open after $i attempts"
              break
            fi
            echo "Attempt $i: waiting..."
            sleep 2
          done
      - name: Setup database
        run: |
          npx prisma db push --accept-data-loss
          npx prisma db seed
      - name: Check port 3000
        run: |
          echo "=== Checking port 3000 ==="
          if nc -z localhost 3000 2>/dev/null; then
            echo "WARNING: port 3000 is already in use!"
            lsof -ti:3000 | xargs kill -9 2>/dev/null || true
            echo "Killed processes on port 3000"
          else
            echo "Port 3000 is free"
          fi
      - name: Start server
        run: |
          nohup npm start > /tmp/nextjs.log 2>&1 &
          echo $! > /tmp/server.pid
          echo "Server PID: $(cat /tmp/server.pid)"
          sleep 1
          echo "Process alive: $(kill -0 $(cat /tmp/server.pid) 2>/dev/null && echo yes || echo NO)"
          echo "=== Initial server log ==="
          cat /tmp/nextjs.log
      - name: Wait for server
        run: |
          SERVER_PID=$(cat /tmp/server.pid)
          for i in $(seq 1 40); do
            sleep 2
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health 2>/dev/null || echo "ERR")
            echo "[$i] HTTP $STATUS (PID alive: $(kill -0 $SERVER_PID 2>/dev/null && echo yes || echo no))"
            if [ "$STATUS" = "200" ]; then
              echo "Server ready!"
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "=== Server log after crash ==="
              cat /tmp/nextjs.log
              exit 1
            fi
          done
          echo "=== Server log ==="
          cat /tmp/nextjs.log
          curl -sf http://localhost:3000/api/health
      - name: Run integration tests
        run: npm run test:integration -- --run --reporter=verbose --reporter=github-actions
