name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run lint:check || echo "Lint warnings (non-blocking)"

  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: dojiro_test
          MARIADB_USER: dojiro
          MARIADB_PASSWORD: dojiro_pass
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    env:
      DATABASE_URL: mysql://dojiro:dojiro_pass@127.0.0.1:3306/dojiro_test
      JWT_SECRET: test-secret-key-for-ci
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build
        run: npm run build
      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 3306 2>/dev/null; then
              echo "MariaDB ready after $i attempts"
              break
            fi
            sleep 2
          done
      - name: Setup database
        run: |
          npx prisma db push --accept-data-loss
          npx prisma db seed
      - name: Start server, run tests, show results
        run: |
          # Kill anything on port 3000
          lsof -ti:3000 | xargs kill -9 2>/dev/null || true

          # Start server
          nohup npm start > /tmp/nextjs.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"

          # Wait up to 30s for server to be ready
          READY=0
          for i in $(seq 1 15); do
            sleep 2
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health 2>/dev/null || echo "000")
            echo "[$i] health: $STATUS"
            if [ "$STATUS" = "200" ]; then
              READY=1
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server died!"
              break
            fi
          done

          echo "=== Server log ==="
          cat /tmp/nextjs.log

          # Emit annotation visible in PR regardless of log access
          echo "::notice title=Server Status::READY=$READY STATUS=$STATUS PID_ALIVE=$(kill -0 $SERVER_PID 2>/dev/null && echo yes || echo no)"

          if [ "$READY" != "1" ]; then
            echo "::error title=Server Failed::Server never became ready. Last STATUS=$STATUS"
            exit 1
          fi

          # Verify server once more right before tests
          PREFLIGHT=$(curl -s http://localhost:3000/api/health 2>/dev/null)
          echo "::notice title=Preflight Health::$PREFLIGHT"

          # Spot-check API responses as annotations
          LOGIN_RESP=$(curl -s -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@example.com","password":"changeme"}')
          echo "::notice title=Login Response::$LOGIN_RESP"

          TOKEN=$(echo "$LOGIN_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('token','NO_TOKEN'))" 2>/dev/null || echo "PARSE_ERROR")
          echo "::notice title=Auth Token::${TOKEN:0:20}..."

          EVENTS_RESP=$(curl -s -H "Authorization: Bearer $TOKEN" http://localhost:3000/api/events 2>/dev/null)
          echo "::notice title=Events Response::${EVENTS_RESP:0:200}"

          # Run tests and capture output
          npm run test:integration -- --run --reporter=verbose 2>&1 | tee /tmp/test_output.txt
          TEST_EXIT=${PIPESTATUS[0]}

          echo "::notice title=Test Exit::code=$TEST_EXIT"
          exit $TEST_EXIT

      - name: Show test output (always)
        if: always()
        run: |
          echo "=== Test output ==="
          cat /tmp/test_output.txt 2>/dev/null || echo "(no test output)"
          echo "=== Server log ==="
          cat /tmp/nextjs.log 2>/dev/null || echo "(no server log)"
