name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run lint:check || echo "Lint warnings (non-blocking)"

  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: dojiro_test
          MARIADB_USER: dojiro
          MARIADB_PASSWORD: dojiro_pass
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    env:
      DATABASE_URL: mysql://dojiro:dojiro_pass@127.0.0.1:3306/dojiro_test
      JWT_SECRET: test-secret-key-for-ci
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build
        run: npm run build
      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 3306 2>/dev/null; then
              echo "MariaDB TCP port open after $i attempts"
              break
            fi
            echo "Attempt $i: waiting..."
            sleep 2
          done
      - name: Setup database
        run: |
          npx prisma db push --accept-data-loss
          npx prisma db seed
      - name: Start server, verify, and run tests
        run: |
          nohup npm start > /tmp/nextjs.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"

          for i in $(seq 1 40); do
            sleep 2
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health 2>/dev/null || echo "ERR")
            echo "[$i] HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Server ready!"
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server process died!"
              break
            fi
          done

          echo "=== Server log ==="
          cat /tmp/nextjs.log

          curl -sf http://localhost:3000/api/health || exit 1
          npm run test:integration -- --run
