name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run lint:check || echo "Lint warnings (non-blocking)"

  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: dojiro_test
          MARIADB_USER: dojiro
          MARIADB_PASSWORD: dojiro_pass
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
    env:
      DATABASE_URL: mysql://dojiro:dojiro_pass@localhost:3306/dojiro_test
      JWT_SECRET: test-secret-key-for-ci
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm ci
      - run: npx prisma generate
      - name: Setup Prisma Database
        run: |
          npx prisma db push --accept-data-loss
          npx prisma db seed
      - name: Start dev server and wait for readiness
        run: |
          nohup npx next dev --port 3000 > /tmp/nextjs.log 2>&1 &
          echo "Server PID: $!"
          echo "Waiting for server..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health; then
              echo "Server is ready after ${i}s"
              break
            fi
            echo "  attempt $i/60..."
            sleep 2
          done
          curl -sf http://localhost:3000/api/health || (echo "=== SERVER LOG ===" && cat /tmp/nextjs.log && exit 1)
      - name: Run Integration Tests
        run: npm run test:integration -- --run
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/nextjs.log || echo "No log file"
