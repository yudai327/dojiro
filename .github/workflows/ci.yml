name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run lint:check || echo "Lint warnings (non-blocking)"

  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: dojiro_test
          MARIADB_USER: dojiro
          MARIADB_PASSWORD: dojiro_pass
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
    env:
      DATABASE_URL: mysql://dojiro:dojiro_pass@localhost:3306/dojiro_test
      JWT_SECRET: test-secret-key-for-ci
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Setup Prisma Database
        run: |
          npx prisma db push --accept-data-loss
          npx prisma db seed
      - name: Start server and wait for readiness
        run: |
          nohup npm start > /tmp/nextjs.log 2>&1 &
          echo "Server PID: $!"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Server ready!"
              break
            fi
            sleep 2
          done
          FINAL=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health)
          if [ "$FINAL" != "200" ]; then
            echo "=== Server failed to start. Log: ==="
            cat /tmp/nextjs.log
            exit 1
          fi
      - name: Run Integration Tests
        run: npm run test:integration -- --run
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/nextjs.log || echo "No log file"
